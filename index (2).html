<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chit Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#15302b;--mut:#5d716c;--line:#cfdad6;--acc:#1f4e79;--on:#fff;--warn:#a65d00;--bad:#a32a2a;--ok:#1d6b45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172622;--ink:#e3eeea;--mut:#8fa5a0;--line:#2a3f3a;--acc:#6fa8dc;--on:#0f1b18;--warn:#e0a24a;--bad:#e27b7b;--ok:#6fcf9a}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172622;--ink:#e3eeea;--mut:#8fa5a0;--line:#2a3f3a;--acc:#6fa8dc;--on:#0f1b18;--warn:#e0a24a;--bad:#e27b7b;--ok:#6fcf9a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{padding:14px 18px 0}h1{margin:0;font-size:21px;font-weight:600}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1320px;margin:12px auto 0}
nav{padding:6px 10px;border-right:1px solid var(--line);position:sticky;top:0;align-self:start}
nav h4{margin:16px 10px 4px;font-size:12.5px;font-weight:500;color:var(--mut)}nav h4:first-child{margin-top:0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
nav button:hover{background:var(--card)}nav button.on{background:var(--acc);color:var(--on);font-weight:500}nav button[disabled]{color:var(--mut);cursor:default;background:none}
main{padding:4px 18px 40px;min-width:0}
.pt{font-size:21px;margin:0 0 2px}.ph{margin-bottom:14px}
.todo{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.todo:last-child{border:0}.todo button.b{margin:0 0 0 6px}
@media(max-width:760px){.app{display:block;margin-top:0}nav{display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line);position:static;padding:8px 10px}nav h4{display:none}nav button{width:auto;white-space:nowrap}}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12.5px;color:var(--mut)}
input,select{width:100%;padding:7px 8px;margin-top:2px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
button.b{background:var(--acc);color:var(--on);border:0;border-radius:4px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer;margin-top:10px}
button.b.s{background:none;color:var(--acc);border:1px solid var(--acc);margin-right:6px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500}
td.n,th.n{text-align:right}.msg{background:var(--card);border-left:4px solid var(--warn);padding:9px 12px;margin-bottom:12px}
.k{display:flex;gap:22px;flex-wrap:wrap}.k div{min-width:120px}.k b{display:block;font-size:22px;font-weight:600}.k span{color:var(--mut);font-size:13px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.wn{color:var(--warn)}.mut{color:var(--mut)}.pv{margin-top:8px;font-size:13.5px;color:var(--mut)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.sb{background:none;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}.sb.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}label i{font-style:normal;margin-left:6px;font-size:12px}
h3{font-size:14px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}h3:first-child{margin-top:0;border:0;padding-top:0}
.hint{color:var(--mut);font-size:13px;margin:0 0 14px}.nav{display:flex;gap:8px;margin-top:20px}.nav button.b{margin-top:0}
.mt td:nth-child(8),.mt2 td:nth-child(5){white-space:normal;min-width:220px}[hidden]{display:none!important}
td .sb{padding:2px 10px;font-size:12px}
#mods{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}#mods button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:10px 14px;font:inherit;cursor:pointer;white-space:nowrap}#mods button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:12px/1.4 monospace}
.ind{margin-left:18px;border-left:1px solid var(--line);padding-left:10px}.lg{padding:2px 0;font-size:14px}details>summary{cursor:pointer;padding:3px 0}
</style></head><body>
<header><h1>Chit Manager</h1><p>Groups, auctions, collections and outstanding. Data stays in this browser.</p></header>
<div id="mods"></div><div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const K='chitmgr1';let S={groups:[],members:[],tickets:[],auctions:[],pays:[],agents:[],adjs:[],n:1};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(x){}
S.agents=S.agents||[];S.adjs=S.adjs||[];if(!S.coa)S.coa=seedCoa();
if(S.agents.length){const mp={};S.agents.forEach(a=>{const id=S.n++;mp[a.id]=id;S.members.push({id,code:a.code,name:a.name,mobile:a.mobile,mem:false,ag:a.type,comm:a.comm,area:a.area,cs:'P'})});S.tickets.forEach(t=>{if(t.agent)t.agent=mp[t.agent]||0;if(t.cag)t.cag=mp[t.cag]||0});S.agents=[]}
const save=()=>{sv=1;try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
const $=s=>document.querySelector(s),nid=()=>S.n++,td=()=>new Date().toISOString().slice(0,10);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const G=i=>S.groups.find(g=>g.id==i),Mb=i=>S.members.find(m=>m.id==i),fmt=a=>a?[a.d,a.s,a.a,a.t].filter(Boolean).join(', ')+(a.n?' - '+a.n:''):'',corr=m=>{const A=m.addr;return A?fmt(m.cs=='P'?A.p:m.cs=='O'?A.o:A.r):(m.cs=='P'?m.perm:m.cs=='O'?m.off:m.curr)};
let tab='dash',ov='g',ag=0,msg='',mv='r',ms=1,keep=null,sv=0,pre='';
const snap=()=>{const k={};document.querySelectorAll('#main input,#main select').forEach(x=>{if(x.id)k[x.id]=x.value});return k};
const flash=m=>{msg=m;if(!sv)keep=snap();sv=0;render();scrollTo(0,0)};
const val=i=>$('#'+i).value;
// ---------- engine ----------
function cm(g){const d=new Date(),s=new Date(g.start);return Math.max(0,Math.min(g.months,(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth()+1))}
const applies=(g,a)=>(a.mode||g.mode)==='NEXT'?a.month+1:(g.first&&a.month==1?2:a.month);
const divFor=(t,m)=>S.auctions.filter(a=>a.gid==t.gid&&applies(G(t.gid),a)==m&&a.elig.includes(t.id)).reduce((s,a)=>s+a.per,0);
const due=(t,m)=>{const g=G(t.gid);return g.inst+(m==1?g.fee:0)-divFor(t,m)};
const tdue=t=>{let s=0;for(let m=1;m<=cm(G(t.gid));m++)s+=due(t,m);return s};
const paid=t=>S.pays.filter(p=>p.tid==t.id).reduce((s,p)=>s+p.amt,0)+S.adjs.filter(a=>a.tid==t.id&&a.type!='GEN').reduce((s,a)=>s+a.sub,0);
const advBal=t=>S.pays.filter(p=>p.tid==t.id).reduce((s,p)=>s+(p.adv||0),0)-S.adjs.filter(a=>a.tid==t.id&&a.type=='ADV').reduce((s,a)=>s+a.sub,0);
const bidRem=t=>{const a=S.auctions.find(x=>x.tid==t.id);return a?a.bid-S.adjs.filter(x=>x.tid==t.id&&x.type=='BID').reduce((s,x)=>s+x.sub,0):0};
const chgBal=(t,h)=>S.pays.filter(p=>p.tid==t.id).reduce((s,p)=>s+(p[h]||0),0)-S.adjs.filter(a=>a.tid==t.id&&a.type=='GEN'&&a.head==h).reduce((s,a)=>s+a.chg,0);
const rcT=p=>p.amt+(p.adv||0)+(p.pen||0)+(p.bank||0)+(p.gst||0)+(p.oth||0);
const out=t=>tdue(t)-paid(t);
function behind(t){const p=paid(t);let c=0,n=0;for(let m=1;m<=cm(G(t.gid));m++){c+=due(t,m);if(c-p>0.5)n++}return n}
function pos(t){if(t.st)return t.st;if(behind(t)>=3)return'Defaulter';const a=S.auctions.find(a=>a.tid==t.id);return a?(a.sec?'Prized, paying':'Prized, security pending'):'Non-prized'}
const an=id=>{const a=Mb(id);return a?e((a.code+' '+a.name).trim()):''};
const rvl={};const aadCell=m=>m.aad?(rvl[m.id]?m.aad.replace(/(\d{4})(?=\d)/g,'$1 '):'xxxx xxxx '+m.aad.slice(-4))+` <button class="sb" onclick="rvl[${m.id}]=!rvl[${m.id}];render()">${rvl[m.id]?'Hide':'Show'}</button>`:m.a4?'xxxx xxxx '+m.a4:'';
const TY={B:'Agent',C:'Collection agent',X:'Agent and collection agent'};
const roles=m=>[m.mem!==false?'Member':'',m.ag?TY[m.ag]:'',m.gu?'Guarantor':''].filter(Boolean).join(', ');
const CH2={pen:'Penalty',bank:'Bank charges',gst:'GST',oth:'Other charges'};
const AT={CAN:'Cancel adjustment',BID:'Bid payable adjustment',ADV:'Advance subscription adjustment',GEN:'General adjustment (collected charges)'};
const tname=t=>`${e(G(t.gid).code)}/${t.no} ${e(Mb(t.mid).name)}`;
const tbl=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th${x[0]=='#'?' class="n"':''}>${x.replace(/^#/,'')}</th>`).join('')}</tr>${r.join('')||'<tr><td class="mut">Nothing here yet.</td></tr>'}</table></div>`;
const tr=c=>`<tr>${c.map(x=>`<td${typeof x=='number'?' class="n"':''}>${typeof x=='number'?inr(x):x}</td>`).join('')}</tr>`;
// ---------- views ----------
const views={
dash(){const ts=S.tickets,o=ts.reduce((s,t)=>s+Math.max(0,out(t)),0),col=S.pays.reduce((s,p)=>s+p.amt,0);
const done=[S.groups.length,S.members.filter(m=>m.ag).length,S.members.length,ts.length,S.auctions.length,S.pays.length,0].map(x=>x>0);
const T=[['grp','Create a chit group','Set the value, installment, commission, dividend rule and the fixed deposit.'],['agt','Add agents','Optional. People who enroll members or collect installments.'],['mem','Register members','Each person is registered once, using PAN or Aadhaar.'],['enr','Enroll members in the group','Choose the nominee, agent and collection agent for each ticket.'],['auc','Hold the monthly auction','Enter the winner and the prize. The dividend is worked out for you.'],['col','Collect installments','Record each receipt from a member.'],['out','Check outstanding','See what is due by group, member, position or collection agent.']];
const N=[];
S.groups.forEach(g=>{const n=S.auctions.filter(a=>a.gid==g.id).length;if(cm(g)>n&&n<g.months)N.push([`${e(g.code)}: the auction for month ${n+1} is pending`,'auc','wn',g.id])});
S.groups.forEach(g=>g.fds.forEach(f=>{const d=Math.round((new Date(f.exp)-new Date())/864e5);if(d<60)N.push([`${e(g.code)}: fixed deposit ${e(f.no)} ${d<0?'expired '+(-d)+' days ago':'expires in '+d+' days'}`,'grp',d<0?'bad':'wn'])}));
const df=ts.filter(t=>pos(t)=='Defaulter').length,sp=ts.filter(t=>pos(t)=='Prized, security pending').length,nn=ts.filter(t=>!t.nom).length;
if(df)N.push([`${df} ticket(s) are defaulters`,'out','bad']);if(sp)N.push([`${sp} prized ticket(s) are waiting for security verification`,'out','wn']);if(nn)N.push([`${nn} ticket(s) have no nominee`,'mem','wn']);
return `<section><div class="k"><div><b>${S.groups.length}</b><span>Groups</span></div><div><b>${ts.length}</b><span>Tickets</span></div><div><b>${inr(col)}</b><span>Collected</span></div><div><b class="${o?'bad':''}">${inr(o)}</b><span>Outstanding</span></div></div></section>
<section><h2>Needs attention</h2>${N.length?N.map(([t,k,c,gid])=>`<div class="todo"><span class="${c}">${t}</span><button class="b s" onclick="${gid?'ag='+gid+';':''}go('${k}')">Open</button></div>`).join(''):'<p class="mut" style="margin:0">Nothing needs attention right now.</p>'}</section>
<section><h2>How to use this software</h2><p class="hint">Follow these steps in order the first time.</p>${T.map(([k,t,d],i)=>`<div class="todo"><span><b>${i+1}. ${t}</b><br><span class="mut">${d}</span></span><span>${done[i]?'<span class="ok">Done</span>':''}<button class="b s" onclick="go('${k}')">Open</button></span></div>`).join('')}</section>
<section><h2>Try it</h2><button class="b s" onclick="demo()">Load demo data</button><button class="b s" onclick="if(confirm('Delete all data in this browser?')){S={groups:[],members:[],tickets:[],auctions:[],pays:[],agents:[],adjs:[],n:1};save();render()}">Clear all data</button></section>`},
grp(){return `<section><h2>Create group</h2><div class="g">
<label>Group code<input id="gc"></label><label>Group name<input id="gn"></label>
<label>Chit value<input id="gv" type="number" value="100000"></label><label>Tickets<input id="gt" type="number" value="20"></label>
<label>Months<input id="gm" type="number" value="20"></label><label>Installment<input id="gi" type="number" value="5000"></label>
<label>Start date<input id="gs" type="date" value="${td().slice(0,8)}01"></label><label>Commission %<input id="gp" type="number" value="5" step="0.1"></label>
<label>Enrollment fee (this group)<input id="ge" type="number" value="0"></label>
<label>Dividend mode<select id="gd"><option value="NEXT">Next month</option><option value="SAME">Same month</option></select></label>
<label>First installment full<select id="gf"><option value="1">Yes</option><option value="0">No</option></select></label>
<label>Prized members get dividend<select id="gz"><option value="1">Yes</option><option value="0">No</option></select></label></div>
<h2 style="margin-top:14px">Fixed deposit</h2><div class="g">
<label>FD number<input id="fn"></label><label>FD start date<input id="fs" type="date"></label><label>FD expiry date<input id="fe" type="date"></label>
<label>Bank (optional)<input id="fb"></label><label>FD amount (optional)<input id="fa" type="number"></label></div>
<button class="b" onclick="addGrp()">Create group</button></section>
<section><h2>Groups</h2>${tbl(['Code','Name','#Value','Tickets','#Installment','#Enroll fee','Dividend','FD no','FD expiry'],S.groups.map(g=>tr([e(g.code),e(g.name),g.value,`${S.tickets.filter(t=>t.gid==g.id).length}/${g.tickets}`,g.inst,g.fee,g.mode=='NEXT'?'Next month':'Same month',e(g.fds.map(f=>f.no).join(', ')),g.fds.map(f=>f.exp).join(', ')])))}</section>`},
mem(){const o=a=>a.map(x=>`<option value="${x.id}">${e(x.mobile?((x.code||'')+' '+x.name).trim():x.code||x.name)}</option>`).join('');
const B=(k,l)=>`<button class="b ${mv==k?'':'s'}" onclick="mv='${k}';render()">${l}</button>`;const f=S.tickets[0]||{};let b='';
if(mv=='r')b=regForm();
if(mv=='o')b=`<section><h2>Change roles</h2><p class="hint">Convert a person: make a member an agent or guarantor, or an agent a member. The details stay the same, so nothing is typed again.</p>
<div class="g2"><label>Person<select id="rp" onchange="fillRoles()">${S.members.map(m=>`<option value="${m.id}">${e(m.code+' '+m.name)}</option>`).join('')}</select></label><label>Member<select id="qM"><option value="1">Yes</option><option value="0">No</option></select></label><label>Agent role<select id="qA"><option value="">None</option><option value="B">Agent</option><option value="C">Collection agent</option><option value="X">Agent and collection agent</option></select></label><label>Guarantor<select id="qG"><option value="0">No</option><option value="1">Yes</option></select></label><label>Commission %<i>optional</i><input id="qC" type="number" step="0.01"></label><label>Area or route<i>optional</i><input id="qR"></label></div>
<div class="nav"><button class="b" onclick="saveRoles()">Save roles</button></div></section>`;
if(mv=='n')b=`<section><h2>Change a ticket's nominee</h2><p class="hint">Each ticket (group and ticket number) has its own nominee. Pick a ticket to view or change it.</p>
<div class="g2"><label>Ticket<select id="nt" onchange="fillNom()">${S.tickets.map(t=>`<option value="${t.id}">${tname(t)}</option>`).join('')}</select></label>
<label>Nominee name<i>required</i><input id="nn" value="${e(f.nom)}"></label><label>Relation<i>optional</i><input id="nr" value="${e(f.nrel)}"></label><label>Nominee mobile<i>optional</i><input id="nb" value="${e(f.nmob)}"></label></div>
<div class="nav"><button class="b" onclick="saveNom()">Save nominee</button></div></section>
<section><h2>Nominees by ticket</h2>${tbl(['Ticket','Nominee','Relation','Mobile','Changes'],S.tickets.map(t=>tr([tname(t),e(t.nom),e(t.nrel),e(t.nmob),''+(t.nh||[]).length])))}</section>`;
if(mv=='l')b=`<section><h2>Registered members</h2><div class="mt">${tbl(['Code','Name','Roles','Mobile','PAN','Aadhaar','GST','Correspondence address','Tickets'],S.members.map(m=>tr([e(m.code),e(m.name),roles(m),e(m.mobile||m.phone),e(m.pan),aadCell(m),e(m.gst),e(corr(m)),S.tickets.filter(t=>t.mid==m.id).map(t=>e(G(t.gid).code)+'/'+t.no).join(', ')])))}</div></section>`;
return `<section style="padding:6px 14px 14px">${B('r','Register')}${B('o','Roles')}${B('n','Nominees')}${B('l','Member list')}</section>`+b},
enr(){const o=a=>a.map(x=>`<option value="${x.id}">${e(x.mobile?((x.code||'')+' '+x.name).trim():x.code||x.name)}</option>`).join(''),ao=f=>'<option value="0">None</option>'+S.members.filter(a=>a.ag&&f(a)).map(a=>`<option value="${a.id}">${e(a.code+' '+a.name)}</option>`).join('');
return `<section><h2>Enroll a member in a group</h2><p class="hint">The first installment is the full installment plus the group's enrollment fee. The nominee and agents belong to these tickets only.</p>
<h3>Enrollment details</h3><div class="g2"><label>Enrollment date<i>required</i><input id="ed" type="date" value="${td()}"></label><label>Member<select id="em">${o(S.members.filter(m=>m.mem!==false))}</select></label><label>Group<select id="eg">${o(S.groups)}</select></label><label>Number of tickets<input id="et" type="number" value="1" min="1"></label></div>
<h3>Agent details</h3>${S.members.some(m=>m.ag)?'':'<p class="hint">No agents yet. Register one in the Agents screen, or leave these as None.</p>'}<div class="g2"><label>Agent<i>who enrolled the member</i><select id="ea">${ao(a=>a.ag!='C')}</select></label><label>Collection agent<i>who collects installments</i><select id="ec">${ao(a=>a.ag!='B')}</select></label><label>Collection area or route<i>optional</i><input id="er"></label></div>
<h3>Enrollment fee</h3><div class="g2"><label>Fee received now<select id="ef"><option value="0">No</option><option value="1">Yes</option></select></label><label>Payment mode<select id="ep"><option>Cash</option><option>UPI</option><option>Cheque</option><option>Bank transfer</option></select></label></div><p class="hint" style="margin:8px 0 0">The fee is the amount set on the group. If received now, it is saved as a receipt for each ticket.</p>
<h3>Nominee for these tickets</h3><div class="g2"><label>Nominee name<i>required</i><input id="nw"></label><label>Relation<i>optional</i><input id="nz"></label><label>Nominee mobile<i>optional</i><input id="nm" inputmode="numeric" maxlength="10"></label></div>
<h3>Remarks</h3><div class="g2"><label>Remarks<i>optional</i><input id="ek"></label></div>
<div class="nav"><button class="b" onclick="enroll()">Enroll</button></div></section>
<section><h2>Recent enrollments</h2>${tbl(['Date','Ticket','Agent','Collection agent','Area'],S.tickets.slice(-15).reverse().map(t=>tr([t.date||'',tname(t),an(t.agent),an(t.cag),e(t.area)])))}</section>`},
agt(){const A=S.members.filter(m=>m.ag);return `<section><p class="hint" style="margin-top:0">Agents are registered with the same details as members. A member can also be made an agent without typing anything again.</p><button class="b" onclick="newAgent()">Register new agent</button><button class="b s" style="margin-left:8px" onclick="mv='o';go('mem')">Make an existing member an agent</button></section>
<section><h2>Agents</h2><div class="mt2">${tbl(['Code','Name','Type','Mobile','Address','Enrolled (tickets)','Collecting (tickets)','Commission','Area','Also a member'],A.map(m=>tr([e(m.code),e(m.name),TY[m.ag],e(m.mobile),e(corr(m)),''+S.tickets.filter(t=>t.agent==m.id).length,''+S.tickets.filter(t=>t.cag==m.id).length,(m.comm||0)+'%',e(m.area),m.mem!==false?'Yes':'No'])))}</div></section>`},
